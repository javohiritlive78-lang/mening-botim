services:
  - type: web
    name: stars-gift-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: BOT_TOKEN
        sync: false

    # Bepul rejada doimiy disk yo'q: har restart/deployda bot.db o'chib ketadi.
    # Ma'lumot saqlanishi shart bo'lsa (Starter, ~$7/oy):
